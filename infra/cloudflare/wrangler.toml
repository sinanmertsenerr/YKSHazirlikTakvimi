name = "yks-annual-classifier"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[observability]
enabled = false

[ai]
binding = "AI"

[[ratelimits]]
name = "CLASSIFIER_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Set the only secret out-of-band; never add it here:
#   npm run secret:cloudflare
