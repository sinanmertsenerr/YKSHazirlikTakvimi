name: Audit official ÖSYM booklet sources

on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-osym-booklets
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify live PDFs against pinned SHA-256 metadata
        run: npm run check:booklets

  notify-failure:
    needs: audit
    if: ${{ always() && needs.audit.result == 'failure' }}
    uses: ./.github/workflows/notify-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      title: 'Resmî kaynak kayması: ÖSYM kitapçık denetimi başarısız'
      body: >-
        Haftalık ÖSYM kitapçık denetimi başarısız oldu: pinli PDF kanıtları canlı kaynakla
        uyuşmuyor olabilir. Kaynağı elle inceleyin; registry değişikliği incelemeli PR ister.
