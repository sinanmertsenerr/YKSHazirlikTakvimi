version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:17'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      expo-sdk-patches:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
        update-types:
          - patch
      development-tooling:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:23'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
